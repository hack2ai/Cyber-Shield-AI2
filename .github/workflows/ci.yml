name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package.json gained Vitest after the original lockfile was created.
      # Regenerate the lockfile in CI before running the quality gate until the
      # refreshed lockfile is committed to the repository.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
