name: CI

on:
  push:
    branches: [main, 'agent/**', 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The repository's lockfile has historically lagged package.json changes.
      # Rebuild the dependency tree deterministically in CI until the lockfile
      # is refreshed and committed.
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Production server smoke test
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=4173 CORS_ORIGINS=http://127.0.0.1:4173 node dist/server.js > /tmp/cyber-shield-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/api/health > /tmp/cyber-shield-health.json; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/cyber-shield-server.log
              exit 1
            fi
            sleep 1
          done

          test -s /tmp/cyber-shield-health.json
          grep -q '"status":"ok"' /tmp/cyber-shield-health.json
