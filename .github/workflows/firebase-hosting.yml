name: Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Verify Hosting output
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -d docs/assets
          printf 'Firebase Hosting output:\n'
          find docs -maxdepth 2 -type f | sort | head -50
          printf '\nindex.html checksum: '
          sha256sum docs/index.html | cut -d ' ' -f1

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Hosting
        run: >-
          npx firebase-tools deploy
          --only hosting:gen-lang-client-0121845763
          --project gen-lang-client-0121845763
          --config firebase.json

      - name: Verify live Hosting site
        env:
          SITE_URL: https://gen-lang-client-0121845763.web.app/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$SITE_URL" -o "$RUNNER_TEMP/site.html"
          ! grep -q "Page Not Found" "$RUNNER_TEMP/site.html"
          grep -q "<!doctype html\|<html" "$RUNNER_TEMP/site.html"

      - name: Remove Firebase service account
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
